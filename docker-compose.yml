services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: astrolabe
      POSTGRES_PASSWORD: astrolabe
      POSTGRES_DB: astrolabe
    ports:
      - "5433:5432"
    volumes:
      - astrolabe_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astrolabe"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  astrolabe_pg_data:
