services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: astrolab
      POSTGRES_PASSWORD: astrolab
      POSTGRES_DB: astrolab
    ports:
      - "5433:5432"
    volumes:
      - astrolab_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astrolab"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  astrolab_pg_data:
